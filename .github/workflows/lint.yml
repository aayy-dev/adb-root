name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck (POSIX sh / ash)
        # Non-blocking: Magisk scripts rely on busybox ash behaviour that
        # shellcheck can flag as style; we surface warnings without failing CI.
        run: |
          shellcheck -s sh -S warning \
            common.sh post-fs-data.sh service.sh action.sh customize.sh || true
