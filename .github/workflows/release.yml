name: Build and Release

# Auto-builds the flashable module zip and publishes a GitHub Release whenever
# the version in module.prop changes (a release for that version is created only
# if one does not already exist). Also runnable manually.
on:
  push:
    branches: [ main ]
    paths:
      - 'module.prop'
      - '**.sh'
      - 'META-INF/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read module version
        id: ver
        run: |
          VERSION=$(sed -n 's/^version=//p' module.prop | tr -d '\r')
          VCODE=$(sed -n 's/^versionCode=//p' module.prop | tr -d '\r')
          if [ -z "$VERSION" ]; then echo "::error::no version in module.prop"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Detected module version '$VERSION' (versionCode $VCODE)"

      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.version }} already exists - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build flashable zip
        if: steps.check.outputs.exists == 'false'
        run: |
          NAME="adb-root-${{ steps.ver.outputs.version }}.zip"
          zip -r -X "$NAME" \
            module.prop common.sh post-fs-data.sh service.sh action.sh customize.sh \
            META-INF README.md LICENSE \
            -x '*.git*'
          echo "ZIP=$NAME" >> "$GITHUB_ENV"
          echo "--- zip contents ---"; unzip -l "$NAME"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.version }}" "$ZIP" \
            --title "${{ steps.ver.outputs.version }}" \
            --notes "Automated release (versionCode ${{ steps.ver.outputs.vcode }}). See CHANGELOG.md for details. Flash the attached zip in the Magisk app."
